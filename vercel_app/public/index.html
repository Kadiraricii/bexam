<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BB Sınav Yakalayıcı - Bulut Canlı Görünüm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --primary-glow: rgba(59, 130, 246, 0.4);
      --success: #22c55e;
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.15);
      --warning-text: #fef3c7;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.18) 0px, transparent 55%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.18) 0px, transparent 55%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.08) 0px, transparent 65%);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
    }

    /* Auth Screen */
    .auth-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      padding: 20px;
      position: relative;
    }

    /* Ambient Glowing Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: floatOrb 10s infinite ease-in-out alternate;
    }
    .orb-1 { width: 300px; height: 300px; background: rgba(59, 130, 246, 0.25); top: 15%; left: 20%; }
    .orb-2 { width: 250px; height: 250px; background: rgba(139, 92, 246, 0.25); bottom: 15%; right: 20%; animation-delay: -5s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }

    .auth-card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 44px 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 30px 60px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-card.shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    .brand-icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px auto;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 10px 25px -5px var(--primary-glow);
    }

    .auth-card h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-card p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 22px;
      text-align: left;
    }

    .form-group label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      font-size: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px 14px 44px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-control-mono {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1.5px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
      background: rgba(11, 15, 25, 0.9);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .toggle-password:hover { color: #fff; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px -4px var(--primary-glow);
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -4px var(--primary-glow);
    }

    .btn:active { transform: translateY(0); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--card-border);
      box-shadow: none;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); box-shadow: none; }

    .error-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 22px;
      display: none;
      text-align: left;
      align-items: center;
      gap: 10px;
    }

    .trust-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 12px;
    }

    .trust-badge-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Dashboard Header */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-badge { background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .live-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    /* Nav Tabs */
    .tabs-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active { color: #fff; background: var(--primary-soft); border: 1px solid rgba(59, 130, 246, 0.3); }

    /* Summary Stats */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
    }

    .stat-val { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .stat-lbl { color: var(--muted); font-size: 13px; }

    /* Courses & Cards */
    .course-title { font-size: 20px; font-weight: 700; margin: 32px 0 16px 0; display: flex; align-items: center; justify-content: space-between; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .exam-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
    }

    .exam-head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .ring-canvas { width: 56px; height: 56px; }

    .exam-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .exam-status { font-size: 13px; font-weight: 600; }
    .exam-status.ok { color: var(--success); }
    .exam-status.warn { color: var(--warning); }

    /* Detailed Missing List on Card */
    .missing-details {
      margin-top: 14px;
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
    }

    .missing-details summary {
      font-size: 13px;
      font-weight: 600;
      color: var(--warning);
      cursor: pointer;
      user-select: none;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .missing-table-card {
      width: 100%;
      margin-top: 10px;
      border-collapse: collapse;
      font-size: 13px;
    }

    .missing-table-card th {
      text-align: left;
      color: var(--muted);
      padding: 6px 4px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .missing-table-card td {
      padding: 8px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* Master Missing Roster View */
    .table-container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 24px;
    }

    .search-bar-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .master-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    .master-table th {
      background: rgba(15, 23, 42, 0.6);
      color: var(--muted);
      font-weight: 600;
      padding: 12px 16px;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--card-border);
    }

    .master-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .master-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge-warn {
      background: var(--warning-soft);
      color: var(--warning-text);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }

    /* Loading Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen" class="auth-wrapper">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="auth-card" id="auth-card-box">
      <div class="brand-icon-wrapper">🌐</div>
      <h1>BB Bulut Görünüm</h1>
      <p>Blackboard Sınav Yakalayıcı masaüstü uygulamasında oluşturulan kodlarla canlı oturuma katılın.</p>
      
      <div id="auth-error" class="error-alert">
        <span>⚠️</span>
        <span id="auth-error-text"></span>
      </div>

      <div class="form-group">
        <label>
          <span>Referans Kodu</span>
          <span style="color: var(--primary); font-size: 11px;">Masaüstü GUI'den Alın</span>
        </label>
        <div class="input-wrapper">
          <span class="input-icon">🏷️</span>
          <input 
            id="inp-ref" 
            type="text" 
            class="form-control form-control-mono" 
            placeholder="REF-8492" 
            autocomplete="off"
            oninput="this.value = this.value.toUpperCase()"
          />
        </div>
      </div>

      <div class="form-group">
        <label>
          <span>PIN Kodu</span>
          <span style="color: var(--muted); font-size: 11px;">4 Haneli Güvenlik PIN'i</span>
        </label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input 
            id="inp-pin" 
            type="password" 
            maxlength="6" 
            class="form-control form-control-mono" 
            placeholder="••••" 
          />
          <button type="button" class="toggle-password" onclick="togglePinVisibility()">👁️</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
        <button id="btn-login" class="btn" style="width: 100%;" onclick="doLogin()">
          <span id="btn-text">🚀 Verileri Canlı Göster</span>
          <span id="btn-spinner" class="spinner" style="display: none;"></span>
        </button>

        <button type="button" class="btn btn-secondary" style="width: 100%; font-size: 13px;" onclick="loadDemoMode()">
          ✨ Demo Verileri İle Önizle (Canlı Test)
        </button>
      </div>

      <div class="trust-badges">
        <div class="trust-badge-item">🔒 256-Bit Şifreli</div>
        <div>•</div>
        <div class="trust-badge-item">⚡ Anlık Canlı Senkron</div>
        <div>•</div>
        <div class="trust-badge-item">🛡️ Salt-Okunur</div>
      </div>
    </div>
  </div>

  <!-- Dashboard Screen -->
  <div id="dash-screen" style="display: none;">
    <header>
      <div class="logo-area">
        <span class="logo-badge">VERCEL CLOUD</span>
        <strong id="header-ref" style="font-family: 'JetBrains Mono', monospace;">REF-XXXX</strong>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span class="live-badge"><span class="live-dot"></span> Canlı Senkronize • <span id="last-sync-time">17:44:50</span></span>
        <button class="btn btn-secondary" style="padding: 6px 14px; font-size: 13px;" onclick="logout()">Çıkış</button>
      </div>
    </header>

    <div class="container">
      <!-- Tabs -->
      <div class="tabs-bar">
        <button id="tab-cards-btn" class="tab-btn active" onclick="switchTab('cards')">📊 Sınav Kartları Görünümü</button>
        <button id="tab-list-btn" class="tab-btn" onclick="switchTab('list')">🚨 Detaylı Eksik Öğrenciler Listesi (<span id="total-missing-badge">0</span>)</button>
      </div>

      <div id="summary-area" class="summary-grid"></div>

      <!-- Tab 1: Cards View -->
      <div id="tab-cards-view">
        <div id="courses-area"></div>
      </div>

      <!-- Tab 2: Master Missing Roster View -->
      <div id="tab-list-view" style="display: none;">
        <div class="table-container">
          <div class="search-bar-row">
            <input id="inp-master-search" type="text" class="form-control" style="padding-left: 16px;" placeholder="🔍 Öğrenci adı, numarası veya sınav adı ile canlı ara..." oninput="renderMasterTable()" />
            <button class="btn btn-secondary" onclick="copyMasterMissingList()">📋 Listeyi Kopyala</button>
            <button class="btn btn-secondary" onclick="downloadMasterCSV()">📥 CSV İndir</button>
          </div>

          <table class="master-table">
            <thead>
              <tr>
                <th style="width: 50px;">#</th>
                <th>Sınav / Ders Klasörü</th>
                <th>Öğrenci Adı Soyadı</th>
                <th>Öğrenci Numarası</th>
                <th>Durum</th>
              </tr>
            </thead>
            <tbody id="master-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeRef = localStorage.getItem('bb_ref') || '';
    let activePin = localStorage.getItem('bb_pin') || '';
    let refreshTimer = null;
    let currentData = null;
    let allMissingStudentsMaster = [];

    if (activeRef && activePin) {
      document.getElementById('inp-ref').value = activeRef;
      document.getElementById('inp-pin').value = activePin;
      doLogin();
    }

    function togglePinVisibility() {
      const pinInp = document.getElementById('inp-pin');
      pinInp.type = pinInp.type === 'password' ? 'text' : 'password';
    }

    function showError(msg) {
      const errEl = document.getElementById('auth-error');
      const errTxt = document.getElementById('auth-error-text');
      const cardBox = document.getElementById('auth-card-box');

      errTxt.innerText = msg;
      errEl.style.display = 'flex';
      
      cardBox.classList.remove('shake');
      void cardBox.offsetWidth; // trigger reflow
      cardBox.classList.add('shake');
    }

    function setLoginLoading(loading) {
      document.getElementById('btn-text').style.display = loading ? 'none' : 'inline';
      document.getElementById('btn-spinner').style.display = loading ? 'inline-block' : 'none';
      document.getElementById('btn-login').disabled = loading;
    }

    async function doLogin() {
      const ref = document.getElementById('inp-ref').value.trim().toUpperCase();
      const pin = document.getElementById('inp-pin').value.trim();
      const errEl = document.getElementById('auth-error');
      errEl.style.display = 'none';

      if (!ref || !pin) {
        showError('Lütfen Referans Kodu ve PIN girin.');
        return;
      }

      setLoginLoading(true);

      try {
        const resp = await fetch(`/api/view?ref_code=${encodeURIComponent(ref)}&pin=${encodeURIComponent(pin)}`);
        const json = await resp.json();
        setLoginLoading(false);

        if (!resp.ok || !json.success) {
          throw new Error(json.error || 'Giriş başarısız.');
        }

        activeRef = ref;
        activePin = pin;
        localStorage.setItem('bb_ref', ref);
        localStorage.setItem('bb_pin', pin);

        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('dash-screen').style.display = 'block';
        document.getElementById('header-ref').innerText = ref;

        renderData(json.data);
        startAutoRefresh();
      } catch (err) {
        setLoginLoading(false);
        showError(err.message);
      }
    }

    function loadDemoMode() {
      const demoData = {
        summary: {
          total_exams: 3,
          captured_sum: 82,
          roster_total_sum: 90,
          exams_with_missing: 2
        },
        courses: [
          {
            name: "BST020 - Veri Madenciliği",
            exams: [
              {
                name: "Vize Sınavı",
                item_count: 30,
                total: 30,
                captured: 30,
                missing: []
              },
              {
                name: "Final Sınavı",
                item_count: 26,
                total: 30,
                captured: 26,
                missing: [
                  { name: "AYŞE YILMAZ", no: "2420171001" },
                  { name: "MEHMET KADİR ARICI", no: "2420191035" },
                  { name: "ZEYNEP KAYA", no: "2420181042" },
                  { name: "CAN DEMİR", no: "2420201012" }
                ]
              }
            ]
          },
          {
            name: "BST024 - Yapay Zeka Uygulamaları",
            exams: [
              {
                name: "Proje Değerlendirmesi",
                item_count: 26,
                total: 30,
                captured: 26,
                missing: [
                  { name: "AHMET ŞAHİN", no: "2420191008" },
                  { name: "ELİF YILDIZ", no: "2420211055" },
                  { name: "BURAK ÇELİK", no: "2420191090" },
                  { name: "SEDA AYDIN", no: "2420221011" }
                ]
              }
            ]
          }
        ]
      };

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('dash-screen').style.display = 'block';
      document.getElementById('header-ref').innerText = "DEMO-LIVE";
      renderData(demoData);
    }

    function logout() {
      localStorage.removeItem('bb_ref');
      localStorage.removeItem('bb_pin');
      clearInterval(refreshTimer);
      document.getElementById('dash-screen').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
    }

    function switchTab(tab) {
      document.getElementById('tab-cards-btn').classList.toggle('active', tab === 'cards');
      document.getElementById('tab-list-btn').classList.toggle('active', tab === 'list');
      document.getElementById('tab-cards-view').style.display = (tab === 'cards') ? 'block' : 'none';
      document.getElementById('tab-list-view').style.display = (tab === 'list') ? 'block' : 'none';
    }

    function startAutoRefresh() {
      clearInterval(refreshTimer);
      refreshTimer = setInterval(async () => {
        if (!activeRef || !activePin) return;
        try {
          const resp = await fetch(`/api/view?ref_code=${encodeURIComponent(activeRef)}&pin=${encodeURIComponent(activePin)}`);
          const json = await resp.json();
          if (resp.ok && json.success) {
            renderData(json.data);
          }
        } catch (e) {}
      }, 5000);
    }

    function renderData(data) {
      if (!data) return;
      currentData = data;

      const syncEl = document.getElementById('last-sync-time');
      if (syncEl) {
        syncEl.innerText = new Date().toLocaleTimeString('tr-TR');
      }

      allMissingStudentsMaster = [];
      (data.courses || []).forEach(course => {
        (course.exams || []).forEach(exam => {
          (exam.missing || []).forEach(s => {
            allMissingStudentsMaster.push({
              course: course.name,
              exam: exam.name,
              name: s.name,
              no: s.no
            });
          });
        });
      });

      document.getElementById('total-missing-badge').innerText = allMissingStudentsMaster.length;

      const summary = data.summary;
      const sumArea = document.getElementById('summary-area');
      if (summary) {
        sumArea.innerHTML = `
          <div class="stat-card">
            <div class="stat-val">${summary.total_exams}</div>
            <div class="stat-lbl">Toplam Sınav Klasörü</div>
          </div>
          <div class="stat-card">
            <div class="stat-val">${summary.captured_sum}/${summary.roster_total_sum}</div>
            <div class="stat-lbl">Toplam Yakalanan PDF</div>
          </div>
          <div class="stat-card">
            <div class="stat-val" style="color: ${allMissingStudentsMaster.length > 0 ? 'var(--warning)' : 'var(--success)'}">
              ${allMissingStudentsMaster.length}
            </div>
            <div class="stat-lbl">Toplam Eksik Öğrenci Sayısı</div>
          </div>
        `;
      }

      const cArea = document.getElementById('courses-area');
      cArea.innerHTML = '';

      (data.courses || []).forEach(course => {
        const cDiv = document.createElement('div');
        cDiv.innerHTML = `<h2 class="course-title"><span>📁 ${course.name}</span></h2>`;
        
        const grid = document.createElement('div');
        grid.className = 'card-grid';

        course.exams.forEach(exam => {
          const card = document.createElement('div');
          card.className = 'exam-card';
          
          let statusText = `${exam.item_count} öğe`;
          let statusClass = '';
          let missingHtml = '';

          if (exam.total !== null) {
            const isComplete = exam.captured >= exam.total;
            const missingCount = (exam.missing || []).length;
            statusText = isComplete ? 'Tamamlandı' : `${missingCount} öğrenci eksik`;
            statusClass = isComplete ? 'ok' : 'warn';

            if (exam.missing && exam.missing.length > 0) {
              const rows = exam.missing.map((s, idx) => `
                <tr>
                  <td style="color: var(--muted); font-weight: 600;">${idx + 1}.</td>
                  <td>⚠ ${s.name}</td>
                  <td style="text-align: right; color: var(--muted); font-family: monospace;">${s.no}</td>
                </tr>
              `).join('');

              missingHtml = `
                <details class="missing-details" open>
                  <summary>
                    <span>⚠ Eksik Öğrenci Listesi (${missingCount} kişi)</span>
                    <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 11px;" onclick="event.preventDefault(); copyExamMissing(${JSON.stringify(exam.name)}, ${JSON.stringify(exam.missing)})">Kopyala</button>
                  </summary>
                  <table class="missing-table-card">
                    <thead>
                      <tr>
                        <th style="width: 24px;">#</th>
                        <th>Ad Soyad</th>
                        <th style="text-align: right;">Öğrenci No</th>
                      </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                  </table>
                </details>
              `;
            }
          }

          const pct = exam.total ? (exam.captured / exam.total) : 1;
          const strokeColor = (exam.captured >= exam.total) ? '#22c55e' : '#f59e0b';

          card.innerHTML = `
            <div class="exam-head">
              <svg class="ring-canvas" viewBox="0 0 36 36">
                <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3" />
                <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="${strokeColor}" stroke-width="3" stroke-dasharray="${pct * 100}, 100" />
                <text x="18" y="20.35" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">${exam.captured || 0}/${exam.total || 0}</text>
              </svg>
              <div>
                <div class="exam-name">${exam.name}</div>
                <div class="exam-status ${statusClass}">${statusText}</div>
              </div>
            </div>
            ${missingHtml}
          `;
          grid.appendChild(card);
        });

        cDiv.appendChild(grid);
        cArea.appendChild(cDiv);
      });

      renderMasterTable();
    }

    function renderMasterTable() {
      const tbody = document.getElementById('master-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';

      const query = (document.getElementById('inp-master-search')?.value || '').trim().toLowerCase();

      const filtered = allMissingStudentsMaster.filter(item => {
        if (!query) return true;
        return item.name.toLowerCase().includes(query) ||
               item.no.toLowerCase().includes(query) ||
               item.exam.toLowerCase().includes(query) ||
               item.course.toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; color: var(--muted); padding: 30px;">
              ${allMissingStudentsMaster.length === 0 ? '🎉 Tebrikler! Tüm sınavlarda eksik öğrenci yok.' : 'Aramanıza uygun eksik öğrenci bulunamadı.'}
            </td>
          </tr>
        `;
        return;
      }

      filtered.forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color: var(--muted); font-weight: 600;">${idx + 1}</td>
          <td>📁 ${item.course} / <strong>${item.exam}</strong></td>
          <td><strong>⚠ ${item.name}</strong></td>
          <td style="font-family: 'JetBrains Mono', monospace; color: var(--muted);">${item.no}</td>
          <td><span class="badge-warn">PDF Gelmedi</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function copyExamMissing(examName, missing) {
      const lines = missing.map(s => `${s.name} (${s.no})`);
      const text = `${examName} Eksik Öğrenci Listesi (${missing.length} kişi):\n` + lines.join('\n');
      navigator.clipboard.writeText(text);
      alert(`${examName} sınavının eksik öğrenci listesi panoya kopyalandı.`);
    }

    function copyMasterMissingList() {
      if (allMissingStudentsMaster.length === 0) {
        alert('Eksik öğrenci bulunmuyor.');
        return;
      }
      const lines = allMissingStudentsMaster.map((s, i) => `${i+1}. [${s.course}/${s.exam}] ${s.name} (${s.no})`);
      const text = `TÜM SINAVLAR EKSİK ÖĞRENCİ LİSTESİ (${allMissingStudentsMaster.length} kişi):\n` + lines.join('\n');
      navigator.clipboard.writeText(text);
      alert('Tüm sınavların eksik öğrenci listesi panoya kopyalandı.');
    }

    function downloadMasterCSV() {
      if (allMissingStudentsMaster.length === 0) {
        alert('İndirilecek eksik öğrenci bulunmuyor.');
        return;
      }
      let csv = "\uFEFFDers;Sınav;Ad Soyad;Öğrenci Numarası\n";
      allMissingStudentsMaster.forEach(s => {
        csv += `"${s.course}";"${s.exam}";"${s.name}";"${s.no}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `eksik_ogrenciler_listesi.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
